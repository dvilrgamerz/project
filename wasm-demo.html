<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DVILR WebAssembly Demo</title><style>body{font-family:system-ui;background:#f7f9f6;color:#17352b;min-height:100vh;display:grid;place-items:center}main{background:white;max-width:560px;border-radius:22px;padding:40px;box-shadow:0 12px 45px #20342b20}h1{font-size:2rem}output{display:block;font-size:3rem;font-weight:800;margin:30px 0;color:#207b57}a{color:#207b57}pre{background:#122a25;color:#c8f9da;padding:20px;border-radius:12px}</style><main><a href="/">← Store</a><h1>DVILR → Wasm</h1><p>A numeric DVILR program compiled directly to WebAssembly, without LLVM or C++:</p><pre>let base = 12
var multiplier = 7
multiplier = multiplier * 3
say base + multiplier</pre><output id="r">Loading…</output><small>This is a numerical Wasm prototype, not a complete compiler or SDK.</small></main><script>(async()=>{try{const r=await fetch("/math.wasm");if(!r.ok)throw Error("HTTP "+r.status);const b=await r.arrayBuffer();const m=await WebAssembly.instantiate(b);document.getElementById("r").textContent=m.instance.exports.run()}catch(e){document.getElementById("r").textContent="Error: "+e.message}})()</script></html>
